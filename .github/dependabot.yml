version: 2
enable-beta-ecosystems: true

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: gomod
    directory: /operator
    schedule:
      interval: weekly
    groups:
      # client-go, apimachinery and controller-runtime only work at matching versions.
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
  - package-ecosystem: docker
    directory: /operator
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directories: ["/", "/.github/workflows/setup"]
    schedule:
      interval: weekly
